<script src="js/creative.js"></script>

<!-- Custom Scripts-->
<script>
    document.getElementById("showPortfolio1").addEventListener("click", showPortfolio);
    document.getElementById("showPortfolio2").addEventListener("click", showPortfolio);
    document.getElementById("showPortfolio3").addEventListener("click", showPortfolio);
    document.getElementById("showCV").addEventListener("click", showCV);
    document.getElementById("showBlog").addEventListener("click", showBlog);

    function showPortfolio() {
        var port = ​document.getElementsByName("portfolio");​
        for (var i = 0; i < port.length; i++) 
        {
            port[i].style.display = block;     
        }
        document.getElementById("blog").style.display = none;   
        document.getElementById("cv").style.display = none;   
    }

    function showBlog() {
        document.getElementById("blog").style.display = block;     
        var port = ​document.getElementsByName("portfolio");​
        for (var i = 0; i < port.length; i++) 
        {
            port[i].style.display = none;   
        }
        document.getElementById("cv").style.display = none;   
    }

    function showCV() {
        document.getElementById("cv").style.display = block;     
        document.getElementById("blog").hidden = true;
        var port = ​document.getElementsByName("portfolio");​
        for (var i = 0; i < port.length; i++) 
        {
            port[i].style.display = none;   
        }
    }
</script>
