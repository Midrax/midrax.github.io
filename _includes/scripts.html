<script src="js/bootstrap.min.js"></script>

<!-- Plugin JavaScript -->
<script src="js/jquery.easing.min.js"></script>
<script src="js/jquery.fittext.js"></script>
<script src="js/wow.min.js"></script>

<!-- Custom Theme JavaScript -->
<script src="js/creative.js"></script>

<!-- Custom Scripts-->
<script>
    document.getElementById("showPortfolio").addEventListener("click", showPortfolio);
    document.getElementById("showCV").addEventListener("click", showCV);
    document.getElementById("showBlog").addEventListener("click", showBlog);

    function showPortfolio() {
        document.getElementById("portfolio").hidden = false;
        document.getElementById("blog").hidden = true;
        document.getElementById("cv").hidden = true;
    }

    function showBlog() {
        document.getElementById("blog").hidden = false;
        document.getElementById("portfolio").hidden = true;
        document.getElementById("cv").hidden = true;
    }

    function showCV() {
        document.getElementById("cv").hidden = false;
        document.getElementById("blog").hidden = true;
        document.getElementById("portfolio").hidden = true;
    }
</script>
