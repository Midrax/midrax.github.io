<section id="contact">
    <div class="container">
        <div class="row">
            <div class="col-xs-12 text-center">
                <h2 class="section-heading">Let's Get In Touch!</h2>
                <hr class="primary">
                <p>Feel free to write me an email, look up my projects on Github or Bitbucket, or check my Linkedin profile!</p>
            </div>
        </div>
        <div class="row" style="margin-bottom: 2em;">
            <div class="col-xs-3 text-center">
                <a href="mailto:{{ site.email }}">
                <i class="fa fa-envelope-o fa-3x wow bounceIn" data-wow-delay=".1s"></i>
                </a>
            </div>
            <div class="col-xs-3 text-center">
                <a href="https://github.com/{{ site.github_username }}">
                <i class="fa fa-github fa-3x wow bounceIn" data-wow-delay=".1s"></i>
                </a>
            </div>
            <div class="col-xs-3 text-center">
                <a href="https://bitbucket.org/{{ site.bitbucket_username }}">
                <i class="fa fa-bitbucket fa-3x wow bounceIn" data-wow-delay=".1s"></i>
                </a>
            </div>
            <div class="col-xs-3 text-center">
                <a href="https://linkedin.com/{{ site.linkedin_username }}">
                <i class="fa fa-linkedin fa-3x wow bounceIn" data-wow-delay=".1s"></i>
                </a>
            </div>
        </div>
        <div class="row">
            <div class="col-xs-12 text-center">
                <h2 class="section-heading">Follow me on Social Media!</h2>
                <hr class="primary">
                <p>We could have more than a healthy professional relationship. We could be friends.</p>
            </div>
        </div>
        <div class="row" style="margin-bottom: 2em;">
            <div class="col-xs-4 text-center">
                <a href="https://twitter.com/{{ site.twitter_username }}">
                    <i class="fa fa-twitter fa-3x wow bounceIn" data-wow-delay=".1s"></i>
                </a>
            </div>
            <div class="col-xs-4 text-center">
                <a href="https://facebook.com/{{ site.facebook_username }}">
                <i class="fa fa-facebook fa-3x wow bounceIn" data-wow-delay=".1s"></i>
                </a>
            </div>
            <div class="col-xs-4 text-center">
                <a href="https://instagram.com/{{ site.instagram_username }}">
                <i class="fa fa-instagram fa-3x wow bounceIn" data-wow-delay=".1s"></i>
                </a>
            </div>
        </div>
        <div class="row">
            <div class="col-xs-12 text-center">
                <h2 class="section-heading">Let's Play Together!</h2>
                <hr class="primary">
                <p>Add me on Steam!</p>
            </div>
        </div>
        <div class="row" style="margin-bottom: 2em;">
            <div class="col-xs-12 text-center">
                <a href="https://steamcommunity.com/id//{{ site.steam_username }}">
                <i class="fa fa-steam fa-3x wow bounceIn" data-wow-delay=".1s"></i>
                </a>
            </div>
        </div>
    </div>
</section>
