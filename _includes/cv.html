<div id="cv"  class="cv">
    <div class="container-fluid">
        <div id="app">
            <div id="toolbar">
              <div id="pager">
                <button data-pager="prev">prev</button>
                <button data-pager="next">next</button>
              </div>
              <div id="page-mode">
                <label>Page Mode <input type="number" value="1" min="1"/></label>
              </div>
            </div>
            <div id="pdf_viewport" role="main"></div>
          </div>
          
          <script src="https://unpkg.com/pdfjs-dist@latest/build/pdf.min.js"></script>
          <script>
            window.onload = () => {
                initPDFViewer("../pdf/CV.pdf");
            };
          </script>
    </div>
</div>
<!-- PDF.JS -->

<script>
    var currentPageIndex = 0;
    var pdfInstance = null;
    var totalPagesCount = 0;

    var pdfjsLib = window['pdfjs-dist/build/pdf'];

    // The workerSrc property shall be specified.
    pdfjsLib.GlobalWorkerOptions.workerSrc = '//mozilla.github.io/pdf.js/build/pdf.worker.js';
    
    window.initPDFViewer = function(pdfURL) {
        pdfjsLib.getDocument(pdfURL).then(function(pdf) 
        {
            pdfInstance = pdf;
            totalPagesCount = pdf.numPages;
            initPager();
            render();
        });
    };

    const viewport = document.querySelector("#pdf_viewport");

    function render() {
        pdfInstance.getPage(currentPageIndex + 1).then(page => {
            viewport.innerHTML = `<div><canvas></canvas></div>`;
            renderPage(page);
        });
    }

    function renderPage(page) {
        let pdfViewport = page.getViewport(1);

        const container = viewport.children[0];

        // Render at the page size scale.
        pdfViewport = page.getViewport(container.offsetWidth / pdfViewport.width);
        const canvas = container.children[0];
        const context = canvas.getContext("2d");
        canvas.height = pdfViewport.height;
        canvas.width = pdfViewport.width;

        page.render({
            canvasContext: context,
            viewport: pdfViewport
        });
    }

    function onPagerButtonsClick(event) {
        const action = event.target.getAttribute("data-pager");
        if (action === "prev") {
            if (currentPageIndex === 0) {
            return;
            }
            currentPageIndex -= pageMode;
            if (currentPageIndex < 0) {
            currentPageIndex = 0;
            }
            render();
        }
        if (action === "next") {
            if (currentPageIndex === totalPagesCount - 1) {
            return;
            }
            currentPageIndex += pageMode;
            if (currentPageIndex > totalPagesCount - 1) {
            currentPageIndex = totalPagesCount - 1;
            }
            render();
        }
    }
</script>
